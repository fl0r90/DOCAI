version: '3.8'

services:
  db:
    image: postgres:16
    volumes:
      - ./data/postgres_v2_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: v2-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/supersecret_dgx_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./data/neo4j_data:/data
      - ./data/neo4j_logs:/logs
    restart: unless-stopped

  llm:
    image: ollama/ollama:latest
    volumes:
      - ./models:/root/.ollama
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: v2-backend
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db
      - FORENSIC_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/forensic_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supersecret_dgx_password
      - REDIS_URL=${REDIS_URL}
      - HF_HOME=/app/ocr_cache/huggingface
      - RAPIDOCR_CACHE=/app/ocr_cache/rapidocr
      - TORCH_HOME=/app/ocr_cache/torch
    volumes:
      - .:/app
      - /app/frontend/node_modules
      - ./ocr_cache:/app/ocr_cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: v2-worker
    command: python -m worker.tasks
    environment:
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db
      - FORENSIC_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/forensic_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supersecret_dgx_password
      - REDIS_URL=${REDIS_URL}
      - HF_HOME=/app/ocr_cache/huggingface
      - RAPIDOCR_CACHE=/app/ocr_cache/rapidocr
      - TORCH_HOME=/app/ocr_cache/torch
    volumes:
      - .:/app
      - ./ocr_cache:/app/ocr_cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: v2-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT}
    volumes:
      - .:/app
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: v2_default
