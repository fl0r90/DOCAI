networks:
  forensic_net:
    driver: bridge
  access_net:
    driver: bridge

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: v2-db-1
    networks: [forensic_net]
    volumes:
      - ./data/postgres_v2_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      - POSTGRES_USER=forensic_admin
      - POSTGRES_PASSWORD=supersecret_dgx_password
      - POSTGRES_DB=forensic_admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensic_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: v2-redis-1
    networks: [forensic_net]
    volumes:
      - ./data/redis_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: v2-neo4j
    networks: [forensic_net]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/supersecret_dgx_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./data/neo4j_data:/data
      - ./data/neo4j_logs:/logs
    restart: unless-stopped

  llm:
    image: ollama/ollama:latest
    container_name: v2-llm-1
    networks: [forensic_net]
    volumes:
      - ./models:/root/.ollama
    ports:
      - "11440:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    image: v2-backend:latest
    container_name: v2-backend
    networks: [forensic_net, access_net]
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/backend
      - AUTH_DATABASE_URL=postgresql://forensic_admin:supersecret_dgx_password@db:5432/auth_db
      - FORENSIC_DATABASE_URL=postgresql://forensic_admin:supersecret_dgx_password@db:5432/forensic_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supersecret_dgx_password
      - REDIS_URL=redis://redis:6379/0
      - HF_HOME=/app/ocr_cache/huggingface
      - HF_HUB_OFFLINE=1
      - RAPIDOCR_CACHE=/app/ocr_cache/rapidocr
      - TORCH_HOME=/app/ocr_cache/torch
      - OLLAMA_URL=http://llm:11434
    volumes:
      - ./ocr_cache:/app/ocr_cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shared_uploads:/app/uploads
      - ./shared_data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: v2-worker:latest
    container_name: v2-worker
    networks: [forensic_net]
    command: python3 -m worker.tasks
    environment:
      - PYTHONPATH=/app/backend
      - AUTH_DATABASE_URL=postgresql://forensic_admin:supersecret_dgx_password@db:5432/auth_db
      - FORENSIC_DATABASE_URL=postgresql://forensic_admin:supersecret_dgx_password@db:5432/forensic_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supersecret_dgx_password
      - REDIS_URL=redis://redis:6379/0
      - HF_HOME=/app/ocr_cache/huggingface
      - HF_HUB_OFFLINE=1
      - RAPIDOCR_CACHE=/app/ocr_cache/rapidocr
      - TORCH_HOME=/app/ocr_cache/torch
      - OLLAMA_URL=http://llm:11434
    volumes:
      - ./ocr_cache:/app/ocr_cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shared_uploads:/app/uploads
      - ./shared_data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: v2-frontend:latest
    container_name: v2-frontend
    networks: [access_net]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev -- -H 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
